<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Microphone body -->
  <rect x="48" y="20" width="32" height="50" rx="16" fill="#000"/>
  <!-- Microphone stand -->
  <rect x="60" y="68" width="8" height="28" fill="#000"/>
  <!-- Recording indicator (red dot) -->
  <circle cx="64" cy="32" r="6" fill="#e74c3c"/>
  <!-- Sound waves -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#000" stroke-width="2" opacity="0.3"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#000" stroke-width="2" opacity="0.2"/>
</svg>
