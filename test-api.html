<!DOCTYPE html>
<html>
<head>
  <title>API Request Test</title>
</head>
<body>
  <h1>Test API Request Capture</h1>
  <button id="testFetch">Test Fetch API</button>
  <button id="testXHR">Test XMLHttpRequest</button>
  <button id="testPost">Test POST Request</button>
  <div id="result"></div>

  <script>
    document.getElementById('testFetch').addEventListener('click', async () => {
      console.log('Testing Fetch API...');
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts/1', {
          headers: { 'Accept': 'application/json' }
        });
        const data = await response.json();
        document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
      } catch (e) {
        console.error('Fetch error:', e);
      }
    });

    document.getElementById('testXHR').addEventListener('click', () => {
      console.log('Testing XMLHttpRequest...');
      const xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://jsonplaceholder.typicode.com/posts/2');
      xhr.onload = function() {
        document.getElementById('result').innerHTML = '<pre>' + xhr.responseText + '</pre>';
      };
      xhr.send();
    });

    document.getElementById('testPost').addEventListener('click', async () => {
      console.log('Testing POST request...');
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: 'Test', body: 'Test body', userId: 1 })
        });
        const data = await response.json();
        document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
      } catch (e) {
        console.error('POST error:', e);
      }
    });
  </script>
</body>
</html>
