<!DOCTYPE html>
<html>
<head>
  <title>Simple API Test</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    button { padding: 10px 20px; margin: 10px; font-size: 16px; }
    .result { margin: 10px 0; padding: 10px; background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>API Request Test</h1>
  <p><strong>Instructions:</strong></p>
  <ol>
    <li>Open DevTools Console (F12)</li>
    <li>Start recording in extension</li>
    <li>Click buttons below</li>
    <li>Watch console for "Bug Recorder: Intercepted fetch" messages</li>
  </ol>

  <button onclick="testAPI1()">Test 1: JSON API</button>
  <button onclick="testAPI2()">Test 2: POST Request</button>
  <button onclick="testAPI3()">Test 3: /api/ URL</button>
  <div id="result" class="result">Results will appear here...</div>

  <script>
    async function testAPI1() {
      console.log('=== TEST 1: JSON API ===');
      const result = document.getElementById('result');
      result.textContent = 'Testing...';
      
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts/1', {
          headers: { 'Accept': 'application/json' }
        });
        const data = await response.json();
        result.textContent = 'Test 1 Success: ' + JSON.stringify(data).substring(0, 100);
        console.log('Test 1 completed');
      } catch (e) {
        result.textContent = 'Test 1 Error: ' + e.message;
        console.error('Test 1 failed:', e);
      }
    }

    async function testAPI2() {
      console.log('=== TEST 2: POST Request ===');
      const result = document.getElementById('result');
      result.textContent = 'Testing...';
      
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: 'Test', body: 'Test body', userId: 1 })
        });
        const data = await response.json();
        result.textContent = 'Test 2 Success: ' + JSON.stringify(data).substring(0, 100);
        console.log('Test 2 completed');
      } catch (e) {
        result.textContent = 'Test 2 Error: ' + e.message;
        console.error('Test 2 failed:', e);
      }
    }

    async function testAPI3() {
      console.log('=== TEST 3: /api/ URL ===');
      const result = document.getElementById('result');
      result.textContent = 'Testing...';
      
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts/1');
        const data = await response.json();
        result.textContent = 'Test 3 Success: ' + JSON.stringify(data).substring(0, 100);
        console.log('Test 3 completed');
      } catch (e) {
        result.textContent = 'Test 3 Error: ' + e.message;
        console.error('Test 3 failed:', e);
      }
    }

    // Log when page loads
    console.log('Test page loaded. Start recording and click buttons.');
  </script>
</body>
</html>
